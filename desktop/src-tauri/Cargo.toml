[package]
name = "mnemosyne-desktop"
version = "0.1.0"
description = "Mnemosyne: preguntas y respuestas sobre tus documentos, 100% local"
authors = ["Víctor Narváez"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mnemosyne_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Cliente HTTP mínimo y bloqueante, para sondear el arranque de los servicios y
# disparar la indexación. No se usa reqwest: traería tokio entero para lo que
# son un puñado de peticiones sincrónicas.
ureq = { version = "2", features = ["json"] }
tauri-plugin-dialog = "2.7.2"
# Deprecado por su autor, y aun así la mejor opción acá: solo lee dos campos del
# config.yaml del motor, el formato que parsea está congelado, y los forks que
# lo suceden tienen mucho menos uso. Reemplazable el día que uno se consolide.
serde_yaml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
flate2 = "1.1.9"
libc = "0.2.189"

