# Ollama is deliberately not containerized here: it runs natively on the host so
# it can reach the GPU without the nvidia-container-toolkit, which fails under a
# snap-installed Docker (confinement blocks access to the driver binaries in
# /usr/bin). The optional "ollama" profile below covers hosts where GPU access
# from Docker does work.

services:
  qdrant:
    # Pinned and kept in step with qdrant-client in pyproject.toml: the client
    # warns when the minor version gap is greater than one.
    image: qdrant/qdrant:v1.19.0
    container_name: mnemosyne-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image ships neither curl nor wget, hence bash's own TCP redirection.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build: .
    container_name: mnemosyne-api
    ports:
      # 8100 on the host avoids clashing with other services that commonly take
      # 8000; the API still listens on 8000 inside the container.
      - "${MNEMOSYNE_PORT:-8100}:8000"
    environment:
      MNEMOSYNE_QDRANT__URL: http://qdrant:6333
      # Ollama runs on the host, outside the compose network, and is reached
      # through the extra_hosts mapping below.
      MNEMOSYNE_OLLAMA__URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mounted rather than copied, so documents and settings can change without
      # rebuilding the image.
      - ./examples:/app/examples:ro
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # Enable with: docker compose --profile ollama up -d
  # Remember to point the API at http://ollama:11434 when using it.
  ollama:
    image: ollama/ollama:latest
    container_name: mnemosyne-ollama
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_data:
