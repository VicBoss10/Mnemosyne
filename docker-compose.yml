# Levanta el sistema completo: vector store, runtime de modelos y API.
# Todo corre local: ningún servicio de acá llama a internet en tiempo de
# ejecución (Ollama solo baja modelos la primera vez, ver scripts/pull_models.sh).

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: mnemosyne-qdrant
    ports:
      - "6333:6333"  # API REST
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # La imagen no trae curl ni wget; el healthcheck usa el TCP del propio bash.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: mnemosyne-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Acceso a la GPU NVIDIA. Si la máquina no tiene GPU o falta el
    # nvidia-container-toolkit, comentar este bloque: Ollama cae a CPU solo
    # (más lento, pero funciona igual).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  api:
    build: .
    container_name: mnemosyne-api
    ports:
      - "8000:8000"
    environment:
      # Dentro de la red de compose los servicios se ven por nombre.
      MNEMOSYNE_QDRANT__URL: http://qdrant:6333
      MNEMOSYNE_OLLAMA__URL: http://ollama:11434
    volumes:
      # Los documentos se montan en vez de copiarse: así se pueden cambiar sin
      # reconstruir la imagen.
      - ./examples:/app/examples:ro
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_data:
