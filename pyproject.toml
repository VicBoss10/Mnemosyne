[project]
name = "mnemosyne"
version = "0.1.0"
description = "Motor RAG 100% local: preguntas y respuestas sobre tus documentos, con citas verificables"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "qdrant-client>=1.12",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "typer>=0.15",
    "pypdf>=5.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Pinned to a minor: el formateador de ruff cambia de criterio entre
    # versiones, así que un rango abierto hace que `ruff format --check` pase o
    # falle según el día en que CI resuelva la dependencia, sin que el código
    # haya cambiado.
    "ruff>=0.16,<0.17",
]

[project.scripts]
mnemosyne = "core.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer declara las opciones de CLI como defaults de los argumentos: es su API,
# no el antipatrón de mutable-default que B008 busca detectar.
"core/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# La raíz del repo en sys.path: dos módulos importan `tests.conftest` por su
# ruta completa, y sin esto la colección falla con ModuleNotFoundError.
pythonpath = ["."]
