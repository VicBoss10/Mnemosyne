name: Release

# Se dispara al empujar una etiqueta de versión:
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# Compilar tarda unos diez minutos por sistema, así que no se hace en cada
# push: la mayoría de los commits no son versiones para distribuir. El disparo
# manual queda igualmente disponible desde la pestaña Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Permite al workflow crear la Release y adjuntarle los instaladores.
permissions:
  contents: write

jobs:
  build:
    # Cada sistema se compila en el suyo: PyInstaller empaqueta la API usando el
    # intérprete de la máquina donde corre, así que produce un ejecutable nativo
    # y no hay forma de generar el .exe desde Linux.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: windows-latest
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Las librerías del webview que Tauri usa para renderizar la interfaz.
      # En Windows las trae WebView2, ya incluido en el sistema.
      - name: Dependencias del sistema (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      # Compilar Rust desde cero son varios minutos; la caché los reduce a menos
      # de uno en las ejecuciones siguientes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # El motor y PyInstaller, que es lo que build_api.py necesita para
      # empaquetar la API. Los modelos no hacen falta: el empaquetado incluye el
      # código, no los pesos.
      - name: Dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Dependencias de Node
        working-directory: desktop
        run: npm ci

      # Un solo comando: descarga Qdrant, empaqueta la API con PyInstaller y
      # arma los instaladores. Es el mismo que se usa en local.
      - name: Construir los instaladores
        working-directory: desktop
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.name }}
          # Solo los paquetes: el directorio de compilación pesa varios GB.
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    # Solo al etiquetar. Un disparo manual sirve para comprobar que compila, y
    # entonces no hay versión que publicar.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: instaladores/*
          generate_release_notes: true
          body: |
            Instaladores de Mnemosyne para Linux y Windows.

            Requiere [Ollama](https://ollama.com) instalado: pesa más que todo
            lo demás junto, así que no viaja dentro. La app comprueba si está y
            ofrece descargar los modelos que falten en el primer arranque.
