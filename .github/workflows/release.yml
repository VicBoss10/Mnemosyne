name: Release

# Se dispara al empujar una etiqueta de versión:
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# Compilar tarda unos diez minutos por sistema, así que no se hace en cada
# push: la mayoría de los commits no son versiones para distribuir. El disparo
# manual queda igualmente disponible desde la pestaña Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Permite al workflow crear la Release y adjuntarle los instaladores.
permissions:
  contents: write

jobs:
  build:
    # Cada sistema se compila en el suyo: PyInstaller empaqueta la API usando el
    # intérprete de la máquina donde corre, así que produce un ejecutable nativo
    # y no hay forma de generar el .exe desde Linux.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            # Cada sistema sube solo los formatos que produce. Tauri ignora en
            # silencio los que no aplican —en Linux no genera el .msi— y listar
            # rutas que nunca van a existir haría ambiguo el control de
            # "no se generó nada", que es el fallo que sí hay que detectar.
            artifacts: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - os: windows-latest
            name: windows
            artifacts: |
              desktop/src-tauri/target/release/bundle/msi/*.msi
              desktop/src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Las librerías del webview que Tauri usa para renderizar la interfaz.
      # En Windows las trae WebView2, ya incluido en el sistema.
      - name: Dependencias del sistema (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: dtolnay/rust-toolchain@stable

      # Compilar Rust desde cero son varios minutos; la caché los reduce a menos
      # de uno en las ejecuciones siguientes.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # El motor y PyInstaller, que es lo que build_api.py necesita para
      # empaquetar la API. Los modelos no hacen falta: el empaquetado incluye el
      # código, no los pesos.
      # En bash por igual en los dos sistemas: PowerShell trata las comillas de
      # ".[dev]" de otra forma y el extra no llegaría a pip.
      - name: Dependencias de Python
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Dependencias de Node
        working-directory: desktop
        run: npm ci

      # Un solo comando: descarga Qdrant, empaqueta la API con PyInstaller y
      # arma los instaladores. Es el mismo que se usa en local.
      - name: Construir los instaladores
        working-directory: desktop
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.name }}
          # Solo los paquetes: el directorio de compilación pesa varios GB.
          path: ${{ matrix.artifacts }}
          # Un build que termina sin producir instaladores es un fallo, aunque
          # ningún paso haya devuelto error.
          if-no-files-found: error

  release:
    # Solo al etiquetar. Un disparo manual sirve para comprobar que compila, y
    # entonces no hay versión que publicar.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true

      # `action-gh-release` no falla cuando su patrón no casa nada: avisa y
      # publica la Release vacía, con todos los pasos en verde. Eso ya pasó una
      # vez —v0.1.0 se publicó sin un solo instalador— y desde fuera parecía un
      # éxito. Contar los paquetes antes de publicar convierte ese silencio en
      # un fallo visible.
      - name: Comprobar que hay instaladores
        run: |
          find instaladores -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) \
            -printf '%f  %s bytes\n'
          total=$(find instaladores -type f \
            \( -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \) | wc -l)
          echo "Instaladores encontrados: $total"
          if [ "$total" -eq 0 ]; then
            echo "::error::No se encontró ningún instalador; no se publica una Release vacía."
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          # Glob recursivo, y no `instaladores/*`: `upload-artifact` conserva la
          # jerarquía de rutas dentro del artefacto, así que los paquetes no
          # quedan sueltos en `instaladores/` sino en
          # `instaladores/desktop/src-tauri/target/release/bundle/<formato>/`.
          # Con un solo nivel el patrón solo casaba el directorio `desktop`, que
          # no es un fichero: la action lo descartaba, avisaba con un
          # "does not match any files" que no es error, y publicaba la Release
          # vacía con todos los pasos en verde.
          # Un patrón por línea en vez de llaves `{deb,msi,...}`: la expansión de
          # llaves depende de la librería de globbing y un fallo aquí vuelve a
          # publicar en silencio una Release sin archivos.
          files: |
            instaladores/**/*.deb
            instaladores/**/*.AppImage
            instaladores/**/*.msi
            instaladores/**/*.exe
          generate_release_notes: true
          body: |
            Instaladores de Mnemosyne para Linux y Windows.

            Requiere [Ollama](https://ollama.com) instalado: pesa más que todo
            lo demás junto, así que no viaja dentro. La app comprueba si está y
            ofrece descargar los modelos que falten en el primer arranque.
